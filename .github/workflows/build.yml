name: Build Lua archive

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lua-aio-tweaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile MoonScript and package Lua
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Lua 5.1
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1.5"

      - name: Set up LuaRocks
        uses: leafo/gh-actions-luarocks@v6

      - name: Install MoonScript
        run: luarocks install moonscript 0.8.0-1

      - name: Compile and archive scripts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          sources=( ./*.moon )
          if (( ${#sources[@]} == 0 )); then
            echo "No MoonScript files found in the repository root."
            exit 1
          fi

          rm -rf .build release
          mkdir -p .build/lua release

          for source in "${sources[@]}"; do
            moonc -t .build/lua "$source"
          done

          lua_files=( .build/lua/*.lua )
          if (( ${#lua_files[@]} != ${#sources[@]} )); then
            echo "The compiler did not produce one Lua file for every MoonScript file."
            exit 1
          fi

          luac -p "${lua_files[@]}"

          archive_label="${GITHUB_REF_NAME//\//-}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            archive_label="${GITHUB_SHA:0:7}"
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            archive_label="latest"
          fi

          archive="release/lua_aio_tweaks-${archive_label}.zip"
          zip -j "$archive" "${lua_files[@]}"
          echo "Created $archive"

      - name: Upload compiled archive
        uses: actions/upload-artifact@v4
        with:
          name: lua-aio-tweaks-archive
          path: release/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish latest or tagged release
    if: github.ref_type == 'tag' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download compiled archive
        uses: actions/download-artifact@v4
        with:
          name: lua-aio-tweaks-archive
          path: release

      - name: Move latest tag to this commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "$GITHUB_SHA"
          git push --force origin refs/tags/latest

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Latest build' }}
          files: release/*.zip
          generate_release_notes: ${{ github.ref_type == 'tag' }}
          make_latest: true
